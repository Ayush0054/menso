[project]
name = "menso-agentos"
version = "0.1.0"
description = "Menso's durable AgentOS trust domain."
requires-python = ">=3.12,<4"
readme = "README.md"
authors = [{ name = "Menso" }]

dependencies = [
  "agno[os,psycopg]==2.8.5",
  "httpx",
  "openai",
  "pydantic",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["mypy", "ruff"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "app*", "db*", "schemas*", "tools*"]
namespaces = false

[tool.ruff]
line-length = 120
exclude = [".venv*", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = [".venv*"]
