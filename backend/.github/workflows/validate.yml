name: Validate backend

on:
  push:
    paths: ["backend/**"]
  pull_request:
    paths: ["backend/**"]

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv pip install --system -r backend/requirements.txt
      - run: uv pip install --system -e backend[dev]
      - run: uv run ruff format --check backend
      - run: uv run bash backend/scripts/validate.sh
